[project]
name = "advisory-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[tool.fastapi]
entrypoint = "advisory_service:app"

[project.scripts]
avs = "advisory_service:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
