name: 901_prt_services
services:
  advisory-service:
    build: .
    image: localhost/advisory_service:latest
    ports:
      - "8000:8000"
    # APP_ENV=docker makes config.py load `.env.docker` (baked into the image).
    # `environment` below wins over the env file, so edit values here to point
    # at your external Redis / Prometheus without rebuilding.
    env_file:
      - .env.docker
    environment:
      APP_ENV: docker
      # Same 901-reactive-gateway network: resolve via container names.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROMETHEUS_BASE_URL: http://prometheus:9090
    volumes:
      # Persist file logs written by logger_config.py (logs/*.log)
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"__import__('urllib.request', fromlist=['urlopen']).urlopen('http://127.0.0.1:8000/api/v1/advisory/ping', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - 901-reactive-gateway

networks:
  901-reactive-gateway:
    external: true
